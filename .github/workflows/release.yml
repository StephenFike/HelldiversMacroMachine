name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and this
# builds both Windows binaries and attaches them to a GitHub Release. That keeps
# the ~96 MB artifacts out of git history while still giving people a download.
#
# Run it manually from the Actions tab to test a build without publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the installer
        run: npm run dist

      - name: Show what was built
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name, Length
        shell: pwsh

      # Only publish for real tag pushes; a manual run just proves it builds.
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelldiversMacroMachine-*-setup.exe
          generate_release_notes: true
          body: |
            ## Attention, Helldiver.

            Super Earth High Command has cleared **Helldivers Macro Machine** for
            deployment. Every stratagem in the arsenal — all 112 of them — bound to
            a single keypress and entered at the exact cadence the stratagem beacon
            demands.

            Your hands are now free. Use them to spread Democracy.

            ## Enlistment

            1. **Requisition** `HelldiversMacroMachine-*-setup.exe` from **Assets** below.
            2. **Run it.** Windows will say **"Windows protected your PC"** — click
               **More info**, then **Run anyway**. The app isn't code-signed, so
               Windows doesn't recognise it. It only happens once.
            3. **Click through the installer.** It installs to your user folder, so
               there is **no administrator prompt**.
            4. **Calibrate.** Open **Settings** and check the **In-game keys** match
               your HELLDIVERS 2 controls. Defaults are `Left Ctrl` + `WASD`, which is
               what a stock install uses. **If you rebound your stratagem controls in
               game and don't change them here, nothing gets called in.**

            Then leave it running in the system tray, drop into a mission, and press
            <kbd>Ctrl</kbd>+<kbd>3</kbd>. Somewhere below, a bug nest is about to meet
            500 kilograms of Freedom.

            *Democracy has landed.*

            The full field manual, troubleshooting and default hotkeys are in the
            [README](https://github.com/${{ github.repository }}#readme).

            > Unofficial fan-made tool. Not affiliated with or endorsed by Arrowhead
            > Game Studios or Sony Interactive Entertainment.

            ---
